events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ==============================
    # Redirect HTTP → HTTPS
    # ==============================
    server {
        listen 80;
        server_name admin.dangvy.com api.dangvy.com shop.dangvy.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==============================
    # admin.dangvy.com → NamEcommerce.Web
    # ==============================
    server {
        listen 443 ssl;
        server_name admin.dangvy.com;

        ssl_certificate     /etc/nginx/ssl/admin/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/admin/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass         http://web:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ==============================
    # api.dangvy.com → Customer.Api
    # ==============================
    server {
        listen 443 ssl;
        server_name api.dangvy.com;

        ssl_certificate     /etc/nginx/ssl/api/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/api/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # CORS headers cho React app
        add_header Access-Control-Allow-Origin "https://shop.dangvy.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        location / {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass         http://customer-api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ==============================
    # shop.dangvy.com → Customer.Client (React)
    # ==============================
    server {
        listen 443 ssl;
        server_name shop.dangvy.com;

        ssl_certificate     /etc/nginx/ssl/shop/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/shop/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass         http://customer-client:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
