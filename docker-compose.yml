version: '3.9'

services:

  # ==============================
  # SQL Server
  # ==============================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: namcommerce-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
      MSSQL_PID: Express
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - namcommerce-net
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost",
             "-U", "sa", "-P", "${SQL_SA_PASSWORD}",
             "-Q", "SELECT 1", "-No"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==============================
  # NamEcommerce.Web (Admin MVC)
  # ==============================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: namcommerce-web
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Server=sqlserver,1433;
        Database=NamEcommerce;
        User Id=sa;
        Password=${SQL_SA_PASSWORD};
        TrustServerCertificate=True;
        MultipleActiveResultSets=True
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - uploads_data:/app/wwwroot/uploads
    networks:
      - namcommerce-net

  # ==============================
  # NamEcommerce.Customer.Api
  # ==============================
  customer-api:
    build:
      context: .
      dockerfile: Dockerfile.customer-api
    container_name: namcommerce-customer-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Server=sqlserver,1433;
        Database=NamEcommerce;
        User Id=sa;
        Password=${SQL_SA_PASSWORD};
        TrustServerCertificate=True;
        MultipleActiveResultSets=True
      TZ: Asia/Ho_Chi_Minh
    networks:
      - namcommerce-net

  # ==============================
  # NamEcommerce.Customer.Client (React/Vite)
  # ==============================
  customer-client:
    build:
      context: .
      dockerfile: Dockerfile.customer-client
      args:
        VITE_API_URL: https://api.${DOMAIN:-tuankhoivlxd.vn}
    container_name: namcommerce-customer-client
    restart: unless-stopped
    networks:
      - namcommerce-net

  # ==============================
  # Nginx — Reverse Proxy
  # ==============================
  nginx:
    image: nginx:alpine
    container_name: namcommerce-nginx
    restart: unless-stopped
    depends_on:
      - web
      - customer-api
      - customer-client
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - namcommerce-net

# ==============================
# Volumes & Networks
# ==============================
volumes:
  sqlserver_data:
  uploads_data:

networks:
  namcommerce-net:
    driver: bridge
